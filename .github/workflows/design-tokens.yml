name: Design tokens

on:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

jobs:
  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:tokens
      - run: bun run lint:tokens
