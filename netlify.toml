# Netlify build configuration.
#
# The Next.js runtime is auto-detected and installed by Netlify, so it is not
# declared here. Bun is detected from bun.lock; the version is pinned below so
# CI cannot drift from local.

[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  BUN_VERSION = "1.3.11"

# WIREFRAME: prototype review tooling. Delete both blocks with the wireframe.
#
# These turn on the sticky notes and the Agentation feedback toolbar for deploy
# previews and branch deploys, and deliberately leave them off for production.
# NEXT_PUBLIC_* values are inlined at build time and every Netlify context is
# its own build, so this is the right lever: the live site cannot accidentally
# ship the commentary or the ~3.6MB feedback library.
[context.deploy-preview.environment]
  NEXT_PUBLIC_SHOW_NOTES = "true"
  NEXT_PUBLIC_ENABLE_AGENTATION = "true"
  NEXT_PUBLIC_FUNDRAISE_UP_LIVEMODE = "false"

[context.branch-deploy.environment]
  NEXT_PUBLIC_SHOW_NOTES = "true"
  NEXT_PUBLIC_ENABLE_AGENTATION = "true"
  NEXT_PUBLIC_FUNDRAISE_UP_LIVEMODE = "false"
